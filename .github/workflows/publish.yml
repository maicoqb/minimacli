name: Publish packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '@minimacli/plugin'
            package: libs/minimacli-plugin/package.json
            dist: dist/libs/minimacli-plugin
            script: npm run publish:minimacli-plugin
          - name: '@minimacli/dsh-plugin'
            package: plugins/minimacli-dsh-plugin/package.json
            dist: dist/plugins/minimacli-dsh-plugin
            script: npm run publish:minimacli-dsh-plugin
          - name: '@minimacli/minimacli'
            package: apps/minimacli/package.json
            dist: dist/minimacli
            script: npm run publish:minimacli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Check version change for ${{ matrix.name }}
        id: version_check
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi

          if git diff --unified=0 "$BEFORE" "${{ github.sha }}" -- "${{ matrix.package }}" | grep -Eq '^[+-].*"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.name }}
        if: steps.version_check.outputs.changed == 'true'
        shell: bash
        run: |
          if [ ! -d "${{ matrix.dist }}" ]; then
            echo "Missing dist folder: ${{ matrix.dist }}"
            exit 1
          fi

          pwd
          ls -la
          find . -maxdepth 3 -type d | grep dist || true
          cd "${{ matrix.dist }}"
          npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
