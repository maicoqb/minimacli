name: Publish packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '@minimacli/plugin'
            package: libs/minimacli-plugin/package.json
            script: npm run publish:minimacli-plugin
          - name: '@minimacli/dsh-plugin'
            package: plugins/minimacli-dsh-plugin/package.json
            script: npm run publish:minimacli-dsh-plugin
          - name: '@minimacli/minimacli'
            package: apps/minimacli/package.json
            script: npm run publish:minimacli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Verify npm auth
        run: |
          npm whoami
          npm view @minimacli/minimacli --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check version change for ${{ matrix.name }}
        id: version_check
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi

          if git diff --unified=0 "$BEFORE" "${{ github.sha }}" -- "${{ matrix.package }}" | grep -Eq '^[+-].*"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show package metadata before publish
        if: steps.version_check.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Checking package metadata for ${{ matrix.name }}"
          echo "--- source package ---"
          cat "${{ matrix.package }}"

          case "${{ matrix.name }}" in
            "@minimacli/plugin") DIST_PATH="dist/libs/minimacli-plugin/package.json" ;;
            "@minimacli/dsh-plugin") DIST_PATH="dist/plugins/minimacli-dsh-plugin/package.json" ;;
            "@minimacli/minimacli") DIST_PATH="dist/minimacli/package.json" ;;
            *) DIST_PATH="dist/package.json" ;;
          esac

          echo "--- generated package ---"
          if [ -f "$DIST_PATH" ]; then
            cat "$DIST_PATH"
          else
            echo "$DIST_PATH not found"
          fi

      - name: Publish ${{ matrix.name }}
        if: steps.version_check.outputs.changed == 'true'
        run: |
          cd "$(dirname "${{ matrix.package }}")"
          npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
